name: build

# Every push to master builds every variant. Pushing a tag v<VERSION>, where VERSION
# matches project() in CMakeLists.txt, additionally publishes a GitHub release with the
# Windows installers and portable zips (x64, ARM64), a GUI bundle (Windows/Linux x64),
# the Ubuntu .deb and Fedora .rpm (x86_64, aarch64) and the macOS .dmg (Apple Silicon). Each build job names its files
# muralop-v<VERSION>-..., so the release job only has to collect them.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Linux ${{ matrix.system }} (Nix flake)
    strategy:
      matrix:
        include:
          - system: x86_64
            runner: ubuntu-latest
          - system: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake (builds the package)
        run: nix flake check -L
      - name: Build
        run: nix build -L .#default

  # The distro builds run in containers: sdbus-c++ 2 needs Ubuntu 26.04 / Fedora 44,
  # whatever the hosted runner images happen to be.
  ubuntu:
    name: Linux ${{ matrix.arch }} (Ubuntu 26.04 .deb)
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config g++ libmpv-dev libwayland-dev libwayland-bin \
            libegl-dev libgles-dev libsdbus-c++-dev libnode-dev dpkg-dev file
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DMURALOP_BUILD_NODE_PLUGIN=ON
          ninja -C build
          ctest --test-dir build --output-on-failure
      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          deb=$(ls ./*.deb)
          dpkg-deb --info "$deb"
          mv "$deb" "muralop-v$(dpkg-deb -f "$deb" Version)-ubuntu-26.04-$(dpkg-deb -f "$deb" Architecture).deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-${{ matrix.arch }}
          path: build/muralop-v*.deb

  fedora:
    name: Linux ${{ matrix.arch }} (Fedora 44 .rpm)
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            mpv-devel wayland-devel libglvnd-devel sdbus-cpp-devel rpm-build
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
          ctest --test-dir build --output-on-failure
      - name: Package .rpm
        run: |
          cd build
          cpack -G RPM
          rpm=$(ls ./*.rpm)
          rpm -qip "$rpm"
          rpm -qpR "$rpm"
          mv "$rpm" "$(rpm -qp --qf 'muralop-v%{VERSION}-fedora-44-%{ARCH}.rpm' "$rpm")"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-44-${{ matrix.arch }}
          path: build/muralop-v*.rpm

  windows:
    name: Windows ${{ matrix.arch }} (MinGW cross from Nix)
    strategy:
      matrix:
        # The libmpv dev archives (include/, libmpv.dll.a, libmpv-2.dll) come from
        # SourceForge, which keeps every weekly build, so a pinned file stays downloadable.
        include:
          - arch: x64
            shell: mingw
            toolchain: cmake/mingw-x86_64.cmake
            sdk: mpv-dev-x86_64-20261018-git-01e2533f31.7z
            sdk_sha256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e
          - arch: arm64
            shell: mingw-arm64
            toolchain: cmake/mingw-aarch64.cmake
            sdk: mpv-dev-aarch64-20261018-git-01e2533f31.7z
            sdk_sha256: 062b07022d1fadefd341485602658a51d973c216bb4282859e10daa09ad55478
    runs-on: ubuntu-latest
    env:
      SDK: ${{ matrix.sdk }}
      SDK_SHA256: ${{ matrix.sdk_sha256 }}
      SHELL_NAME: ${{ matrix.shell }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch libmpv SDK
        run: |
          curl -fsSL -o "$SDK" "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/$SDK"
          echo "${SDK_SHA256}  $SDK" | sha256sum -c -
          nix develop ".#$SHELL_NAME" -c 7zz x -y -o"$RUNNER_TEMP/mpv-sdk" "$SDK" > /dev/null
      - name: Build
        run: |
          node_headers=$(nix develop ".#$SHELL_NAME" -c node -p "require('path').resolve(process.execPath, '../../include/node')")
          plugin=OFF
          if [ "$SHELL_NAME" = mingw ]; then plugin=ON; fi
          nix develop ".#$SHELL_NAME" -c cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DMPV_SDK_DIR="$RUNNER_TEMP/mpv-sdk" \
            -DMURALOP_BUILD_NODE_PLUGIN="$plugin" -DNODE_INCLUDE_DIR="$node_headers"
          nix develop ".#$SHELL_NAME" -c ninja -C build-win
      - name: Export GUI playback plugin and control host
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-player-x64
          path: |
            build-win/muralop.exe
            build-win/libmpv-2.dll
            build-win/muralop_control_test.exe
            build-win/desktop/muralop.node
            build-win/desktop/package.json
      - name: Package installer and portable zip
        run: |
          nix develop ".#$SHELL_NAME" -c ninja -C build-win installer portable
          ls -l build-win/muralop-v*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build-win/muralop-v*-setup.exe
            build-win/muralop-v*-portable.zip

  gui:
    name: GUI (${{ matrix.os }})
    needs: [ubuntu, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install GUI build dependencies
        run: |
          python -m pip install -r desktop/requirements.txt pyinstaller pytest
          npm ci --prefix desktop
      - name: Test Electron tasks and process cancellation
        run: npm test --prefix desktop
      - name: Prepare private Linux Chromium runtime libraries
        if: runner.os == 'Linux'
        run: |
          mkdir -p chromium-runtime
          cd chromium-runtime
          mkdir -p apt-state/lists/partial apt-cache/archives/partial
          apt-get -o Dir::State::lists="$PWD/apt-state/lists" -o Dir::Cache="$PWD/apt-cache" update
          apt-get -o Dir::State::lists="$PWD/apt-state/lists" -o Dir::Cache="$PWD/apt-cache" download \
            libegl1 libgl1 libglvnd0 libglx0 libnss3 libasound2t64
          for deb in ./*.deb; do dpkg-deb -x "$deb" .; done
          echo "LD_LIBRARY_PATH=$PWD/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Download Windows playback plugin
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-player-x64
          path: player
      - name: Prepare Windows playback plugin
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item player/desktop/muralop.node player/muralop.node
          Move-Item player/desktop/package.json player/package.json
      - name: Test Windows IPC and GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MURALOP_CONTROL_TEST = "$pwd/player/muralop_control_test.exe"
          python -m pytest tests/test_session.py tests/test_windows_pipe.py -q
          npm start --prefix desktop -- --smoke-test ../gui-preview.png
      - name: Download Ubuntu playback plugin
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-26.04-amd64
          path: player-deb
      - name: Extract Ubuntu playback plugin
        if: runner.os == 'Linux'
        run: |
          mkdir -p player-extract player
          dpkg-deb -x player-deb/*.deb player-extract
          cp player-extract/usr/share/muralop/desktop/{muralop.node,package.json} player/
      - name: Test Linux GUI
        if: runner.os == 'Linux'
        run: |
          python -m pytest tests/test_session.py tests/test_windows_pipe.py -q
          xvfb-run -a npm start --prefix desktop -- --no-sandbox --disable-gpu --smoke-test ../gui-preview.png
      - name: Package GUI, yt-dlp and Deno
        run: python desktop/package.py --player-dir player
      - name: Smoke-test packaged Electron on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process ./dist/gui/muralop-ui/muralop-ui.exe -ArgumentList '--smoke-test', "$pwd/build-electron/packaged-preview.png" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged GUI failed' }
          if (!(Test-Path build-electron/packaged-preview.png)) { throw 'Missing GUI preview' }
      - name: Smoke-test packaged Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/gui/muralop-ui/muralop-ui --no-sandbox --disable-gpu --smoke-test build-electron/packaged-preview.png
      - name: Archive GUI bundle
        shell: bash
        run: |
          version=$(sed -n 's/^project(Muralop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p assets
          if [ "$RUNNER_OS" = Windows ]; then
            python -c "import shutil; shutil.make_archive('assets/muralop-v${version}-windows-x64-gui', 'zip', root_dir='dist/gui', base_dir='muralop-ui')"
          else
            tar -czf "assets/muralop-v${version}-linux-gui-x64.tar.gz" -C dist/gui muralop-ui
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ runner.os }}-x64
          path: assets/muralop-v*

  macos:
    name: macOS arm64 (.dmg)
    # libmpv and its libraries come from Homebrew, which only builds Apple Silicon
    # bottles now; the dmg needs the macOS version of this runner image or later.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install mpv dylibbundler ninja pkgconf
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
          ctest --test-dir build --output-on-failure
      - name: Package .dmg
        run: |
          ninja -C build dmg
          ls -l build/muralop-v*.dmg
      - name: Smoke test the packaged app
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" build/muralop-v*.dmg
          cp -R "$mnt/Muralop.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/Muralop.app"
          plutil -p "$app/Contents/Info.plist"
          ffmpeg -v error -f lavfi -i testsrc2=size=1920x1080:rate=30 -t 10 -pix_fmt yuv420p "$RUNNER_TEMP/test.mp4"
          conf="$HOME/Library/Application Support/Muralop"
          mkdir -p "$conf"
          printf 'video=%s\n' "$RUNNER_TEMP/test.mp4" > "$conf/config.ini"
          # Still running after 10 s and has drawn video: the bundled libraries load and
          # the desktop window renders (with Apple's software renderer on these VMs).
          MURALOP_DEBUG=1 "$app/Contents/MacOS/Muralop" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!
          sleep 10
          alive=yes
          kill -0 "$pid" 2> /dev/null || alive=no
          kill "$pid" 2> /dev/null || true
          cat "$RUNNER_TEMP/smoke.log"
          [ "$alive" = yes ] && grep -q 'frames drawn' "$RUNNER_TEMP/smoke.log"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/muralop-v*.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, ubuntu, fedora, windows, gui, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against project version
        run: |
          # v3.0.0 and v3.0.0-rc1 both need VERSION 3.0.0.
          version=$(sed -n 's/^project(Muralop VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version ${version}; bump project(VERSION) first"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          rm -f muralop.exe libmpv-2.dll muralop_control_test.exe
          rm -rf desktop
          sha256sum -- * > SHA256SUMS
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc1 and the like become pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Muralop ${GITHUB_REF_NAME}" "${prerelease[@]}"
