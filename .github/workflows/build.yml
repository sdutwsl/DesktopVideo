name: build

# Every push to master builds all three variants. Pushing a tag v<VERSION>, where
# VERSION matches project() in CMakeLists.txt, additionally publishes a GitHub release
# with the Windows zip and the Ubuntu .deb.
on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Windows build links against a libmpv dev archive (include/, libmpv.dll.a, libmpv-2.dll).
  # SourceForge keeps every weekly build, so a pinned file stays downloadable.
  MPV_SDK_URL: https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20261018-git-01e2533f31.7z
  MPV_SDK_SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e

jobs:
  nix:
    name: Linux (Nix flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake (builds the package)
        run: nix flake check -L
      - name: Build
        run: nix build -L .#default

  ubuntu:
    name: Linux (Ubuntu apt + CMake)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ libmpv-dev libwayland-dev libwayland-bin \
            libegl-dev libgles-dev libsdbus-c++-dev dpkg-dev file
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
          ctest --test-dir build --output-on-failure
      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          dpkg-deb --info ./*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-ubuntu-24.04-amd64
          path: build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-test-host-Linux
          path: build/vw_control_test

  windows:
    name: Windows (MinGW cross from Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch libmpv SDK
        run: |
          curl -fsSL -o mpv-dev.7z "$MPV_SDK_URL"
          echo "${MPV_SDK_SHA256}  mpv-dev.7z" | sha256sum -c -
          nix develop .#mingw -c 7z x -y -o"$RUNNER_TEMP/mpv-sdk" mpv-dev.7z > /dev/null
      - name: Build
        run: |
          nix develop .#mingw -c cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DMPV_SDK_DIR="$RUNNER_TEMP/mpv-sdk"
          nix develop .#mingw -c ninja -C build-win
      - name: Collect package
        run: |
          mkdir -p dist
          cp build-win/videowallpaper.exe build-win/libmpv-2.dll dist/
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-windows-x64
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-test-host-Windows
          path: build-win/vw_control_test.exe

  gui:
    name: GUI (${{ matrix.os }})
    needs: [ubuntu, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI build dependencies
        run: python -m pip install -r gui/requirements.txt pyinstaller pytest
      - name: Windows backend
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: videowallpaper-windows-x64
          path: backend
      - name: Windows control test host
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: videowallpaper-test-host-Windows
          path: backend-test
      - name: Test Windows IPC and GUI helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VW_CONTROL_TEST = "$pwd/backend-test/vw_control_test.exe"
          python -m pytest tests -q
          $env:QT_QPA_PLATFORM = 'offscreen'
          python gui/main.py --smoke-test gui-preview.png
      - name: Ubuntu backend package
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: videowallpaper-ubuntu-24.04-amd64
          path: backend-deb
      - name: Install Linux runtime dependencies and extract backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./backend-deb/*.deb \
            libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64 libegl1
          mkdir backend
          cp "$(command -v videowallpaper)" backend/
      - name: Linux control test host
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: videowallpaper-test-host-Linux
          path: backend-test
      - name: Test Linux D-Bus and GUI helpers
        if: runner.os == 'Linux'
        run: |
          chmod +x backend-test/vw_control_test
          VW_CONTROL_TEST="$PWD/backend-test/vw_control_test" dbus-run-session -- \
            python -m pytest tests/test_session.py tests/test_windows_pipe.py -q
      - name: Package GUI, yt-dlp and Deno
        run: python gui/package.py --backend-dir backend
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-gui-${{ runner.os }}-x64
          path: dist/gui/videowallpaper-ui/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, ubuntu, windows, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against project version
        run: |
          # v2.1.0 and v2.1.0-rc1 both need VERSION 2.1.0.
          version=$(sed -n 's/^project(VideoWallpaper VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version ${version}; bump project(VERSION) first"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble assets
        run: |
          mkdir -p assets
          (cd artifacts/videowallpaper-gui-Windows-x64 &&
            zip -qr9 "$GITHUB_WORKSPACE/assets/videowallpaper-${GITHUB_REF_NAME}-windows-x64.zip" .)
          tar -czf "assets/videowallpaper-${GITHUB_REF_NAME}-linux-gui-x64.tar.gz" \
            -C artifacts/videowallpaper-gui-Linux-x64 .
          cp artifacts/videowallpaper-ubuntu-24.04-amd64/*.deb \
            "assets/videowallpaper-${GITHUB_REF_NAME}-ubuntu-24.04-amd64.deb"
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc1 and the like become pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "VideoWallpaper ${GITHUB_REF_NAME}" "${prerelease[@]}"
