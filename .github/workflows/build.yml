name: build

# Every push to master builds every variant. Pushing a tag v<VERSION>, where VERSION
# matches project() in CMakeLists.txt, additionally publishes a GitHub release with
# the Windows zip, the Ubuntu .deb and the Fedora .rpm.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Windows build links against a libmpv dev archive (include/, libmpv.dll.a, libmpv-2.dll).
  # SourceForge keeps every weekly build, so a pinned file stays downloadable.
  MPV_SDK_URL: https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20261018-git-01e2533f31.7z
  MPV_SDK_SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e

jobs:
  nix:
    name: Linux (Nix flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake (builds the package)
        run: nix flake check -L
      - name: Build
        run: nix build -L .#default

  # The distro builds run in containers: sdbus-c++ 2 needs Ubuntu 26.04 / Fedora 44,
  # whatever the hosted runner images happen to be.
  ubuntu:
    name: Linux (Ubuntu 26.04 .deb)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config g++ libmpv-dev libwayland-dev libwayland-bin \
            libegl-dev libgles-dev libsdbus-c++-dev dpkg-dev file
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          dpkg-deb --info ./*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-ubuntu-26.04-amd64
          path: build/*.deb

  fedora:
    name: Linux (Fedora 44 .rpm)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            mpv-devel wayland-devel libglvnd-devel sdbus-cpp-devel rpm-build
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
      - name: Package .rpm
        run: |
          cd build
          cpack -G RPM
          rpm -qip ./*.rpm
          rpm -qpR ./*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-fedora-44-x86_64
          path: build/*.rpm

  windows:
    name: Windows (MinGW cross from Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch libmpv SDK
        run: |
          curl -fsSL -o mpv-dev.7z "$MPV_SDK_URL"
          echo "${MPV_SDK_SHA256}  mpv-dev.7z" | sha256sum -c -
          nix develop .#mingw -c 7z x -y -o"$RUNNER_TEMP/mpv-sdk" mpv-dev.7z > /dev/null
      - name: Build
        run: |
          nix develop .#mingw -c cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DMPV_SDK_DIR="$RUNNER_TEMP/mpv-sdk"
          nix develop .#mingw -c ninja -C build-win
      - name: Collect package
        run: |
          mkdir -p dist
          cp build-win/videowallpaper.exe build-win/libmpv-2.dll dist/
      - uses: actions/upload-artifact@v4
        with:
          name: videowallpaper-windows-x64
          path: dist/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, ubuntu, fedora, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against project version
        run: |
          # v2.1.0 and v2.1.0-rc1 both need VERSION 2.1.0.
          version=$(sed -n 's/^project(VideoWallpaper VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version ${version}; bump project(VERSION) first"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble assets
        run: |
          mkdir -p assets
          (cd artifacts/videowallpaper-windows-x64 &&
            zip -9 "$GITHUB_WORKSPACE/assets/videowallpaper-${GITHUB_REF_NAME}-windows-x64.zip" videowallpaper.exe libmpv-2.dll)
          cp artifacts/videowallpaper-ubuntu-26.04-amd64/*.deb \
            "assets/videowallpaper-${GITHUB_REF_NAME}-ubuntu-26.04-amd64.deb"
          cp artifacts/videowallpaper-fedora-44-x86_64/*.rpm \
            "assets/videowallpaper-${GITHUB_REF_NAME}-fedora-44-x86_64.rpm"
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc1 and the like become pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "VideoWallpaper ${GITHUB_REF_NAME}" "${prerelease[@]}"
