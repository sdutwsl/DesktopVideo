name: build

# Every push to master builds every variant. Pushing a tag v<VERSION>, where VERSION
# matches project() in CMakeLists.txt, additionally publishes a GitHub release with the
# Windows installers and portable zips (x64, ARM64) and the Ubuntu .deb and Fedora .rpm
# (x86_64, aarch64). Each build job names its files videowallpaper-v<VERSION>-..., so the
# release job only has to collect them.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Linux ${{ matrix.system }} (Nix flake)
    strategy:
      matrix:
        include:
          - system: x86_64
            runner: ubuntu-latest
          - system: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake (builds the package)
        run: nix flake check -L
      - name: Build
        run: nix build -L .#default

  # The distro builds run in containers: sdbus-c++ 2 needs Ubuntu 26.04 / Fedora 44,
  # whatever the hosted runner images happen to be.
  ubuntu:
    name: Linux ${{ matrix.arch }} (Ubuntu 26.04 .deb)
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config g++ libmpv-dev libwayland-dev libwayland-bin \
            libegl-dev libgles-dev libsdbus-c++-dev dpkg-dev file
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          deb=$(ls ./*.deb)
          dpkg-deb --info "$deb"
          mv "$deb" "videowallpaper-v$(dpkg-deb -f "$deb" Version)-ubuntu-26.04-$(dpkg-deb -f "$deb" Architecture).deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-26.04-${{ matrix.arch }}
          path: build/videowallpaper-v*.deb

  fedora:
    name: Linux ${{ matrix.arch }} (Fedora 44 .rpm)
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            mpv-devel wayland-devel libglvnd-devel sdbus-cpp-devel rpm-build
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
      - name: Package .rpm
        run: |
          cd build
          cpack -G RPM
          rpm=$(ls ./*.rpm)
          rpm -qip "$rpm"
          rpm -qpR "$rpm"
          mv "$rpm" "$(rpm -qp --qf 'videowallpaper-v%{VERSION}-fedora-44-%{ARCH}.rpm' "$rpm")"
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-44-${{ matrix.arch }}
          path: build/videowallpaper-v*.rpm

  windows:
    name: Windows ${{ matrix.arch }} (MinGW cross from Nix)
    strategy:
      matrix:
        # The libmpv dev archives (include/, libmpv.dll.a, libmpv-2.dll) come from
        # SourceForge, which keeps every weekly build, so a pinned file stays downloadable.
        include:
          - arch: x64
            shell: mingw
            toolchain: cmake/mingw-x86_64.cmake
            sdk: mpv-dev-x86_64-20261018-git-01e2533f31.7z
            sdk_sha256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e
          - arch: arm64
            shell: mingw-arm64
            toolchain: cmake/mingw-aarch64.cmake
            sdk: mpv-dev-aarch64-20261018-git-01e2533f31.7z
            sdk_sha256: 062b07022d1fadefd341485602658a51d973c216bb4282859e10daa09ad55478
    runs-on: ubuntu-latest
    env:
      SDK: ${{ matrix.sdk }}
      SDK_SHA256: ${{ matrix.sdk_sha256 }}
      SHELL_NAME: ${{ matrix.shell }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch libmpv SDK
        run: |
          curl -fsSL -o "$SDK" "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/$SDK"
          echo "${SDK_SHA256}  $SDK" | sha256sum -c -
          nix develop ".#$SHELL_NAME" -c 7zz x -y -o"$RUNNER_TEMP/mpv-sdk" "$SDK" > /dev/null
      - name: Build
        run: |
          nix develop ".#$SHELL_NAME" -c cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DMPV_SDK_DIR="$RUNNER_TEMP/mpv-sdk"
          nix develop ".#$SHELL_NAME" -c ninja -C build-win
      - name: Package installer and portable zip
        run: |
          nix develop ".#$SHELL_NAME" -c ninja -C build-win installer portable
          ls -l build-win/videowallpaper-v*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            build-win/videowallpaper-v*-setup.exe
            build-win/videowallpaper-v*-portable.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, ubuntu, fedora, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against project version
        run: |
          # v2.1.0 and v2.1.0-rc1 both need VERSION 2.1.0.
          version=$(sed -n 's/^project(VideoWallpaper VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v${version}" != "${GITHUB_REF_NAME%%-*}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version ${version}; bump project(VERSION) first"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          ls -l
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc1 and the like become pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "VideoWallpaper ${GITHUB_REF_NAME}" "${prerelease[@]}"
