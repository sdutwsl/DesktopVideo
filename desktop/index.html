<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muralop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <header><span class="brand-mark">M</span><div><h1>Muralop</h1><p>让视频成为桌面风景</p></div></header>
    <section id="feedback" data-phase="connecting" aria-live="polite">
      <div class="phase-row"><span id="indicator"></span><strong id="phase">连接中</strong><span id="elapsed"></span></div>
      <p id="message">正在连接播放后端…</p>
      <div id="progress"><span></span></div>
      <button id="cancel" hidden>取消当前任务</button>
    </section>
    <form id="play-form">
      <label for="monitor">播放到</label><select id="monitor"><option value="">所有显示器（默认视频）</option></select>
      <label for="source">视频来源</label><input id="source" placeholder="粘贴 B站、YouTube 等视频网址" autocomplete="off">
      <button id="play" class="primary" type="submit">播放到桌面</button>
    </form>
    <section id="playlist-panel" hidden>
      <label id="playlist-title" for="playlist-entry">视频合集</label>
      <select id="playlist-entry" aria-label="选择合集视频"></select>
      <div class="row playlist-controls"><button id="previous-entry">上一个</button><button id="play-entry">播放所选</button><button id="next-entry">下一个</button></div>
    </section>
    <div class="row"><button id="file">选择本地视频</button><button id="clear" title="恢复此显示器的默认视频">恢复默认</button></div>
    <div class="playback-controls"><button id="pause">暂停</button><button id="mute">静音</button></div>
    <label for="volume">音量 <output id="volume-value">50</output></label><input id="volume" type="range" min="0" max="100" value="50">
    <label for="quality">画质</label><select id="quality"><option value="">自动画质</option><option value="bestvideo[height&lt;=1080]+bestaudio/best[height&lt;=1080]">最高 1080p</option><option value="bestvideo[height&lt;=2160]+bestaudio/best[height&lt;=2160]">最高 2160p</option></select>
    <details><summary>登录会话与播放设置</summary>
      <p class="hint">网页会记住登录。也可以导入浏览器会话或 cookies.txt，导入会替换现有登录。Google 提示 Cookie 有问题时，先清除登录会话再登录。</p>
      <label for="browser">导入来源</label><select id="browser"><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="firefox">Firefox</option><option value="chromium">Chromium</option><option value="brave">Brave</option></select>
      <input id="profile" placeholder="浏览器配置名称或路径，可留空">
      <button id="import-browser">导入浏览器登录会话</button><button id="import-file">从 cookies.txt 导入</button><button id="clear-session">清除登录会话</button>
      <label for="extractor">yt-dlp 路径</label><input id="extractor" placeholder="使用内置解析器">
      <p class="hint">留空使用随应用提供的版本。</p>
    </details>
    <footer><span>独立视频播放核心</span><button id="connect">重连</button><button id="quit-ui" title="退出界面，壁纸继续播放">退出界面</button></footer>
  </aside>
  <main>
    <div class="browser-header"><select id="site" aria-label="视频站点"></select><p id="playback-summary" aria-live="polite">点击视频，播放到桌面</p></div>
    <p id="browser-status" role="status">正在加载网页…</p>
    <button id="retry-browser" hidden>重新加载网页</button>
    <div id="browser-slot"><span>正在加载网页…</span></div>
  </main>
  <script src="renderer.cjs"></script>
</body>
</html>
